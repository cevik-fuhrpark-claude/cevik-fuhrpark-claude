:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}

/* Markenleiste */
.bar{background:var(--brand-bar);color:var(--brand-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--brand-red)}

.btn:hover{border-color:var(--fg)}

.pad button{min-height:76px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--f-display);font-size:1.9rem;font-weight:700}
.pad button:active{background:var(--surface-2);transform:scale(.98)}
.pad .fn{font-size:1.05rem;color:var(--muted)}
.login .err{color:var(--sos);font-weight:600;min-height:1.4em;margin:0}
.login .hint{font-size:.9rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}

/* Kopf + Navigation */
.head{display:flex;flex-direction:column;gap:6px}
.head small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-weight:600;color:var(--muted);font-size:.8rem}
.head h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:700;line-height:1.15}
.head h1 em{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav .tabbtn{min-height:52px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:8px 18px;font-family:var(--f-display);font-weight:700;font-size:1.1rem;display:flex;gap:10px;align-items:center}
.nav .tabbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.nav .cnt{font-family:var(--f-mono);font-size:.8rem;background:var(--grey-bg);border-radius:99px;padding:1px 8px;color:var(--muted)}
.nav .tabbtn .cnt.hot{background:var(--sos-bg);color:var(--sos)}
.nav .spacer{flex:1}
.lock{font-size:.75rem;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}

/* Auftragstafel */
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:280px;scroll-snap-align:start}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 6px;border-bottom:1px solid var(--line)}
.col-h h2{font-size:1.05rem;text-transform:uppercase;letter-spacing:.08em}
.col-h .n{font-family:var(--f-mono);font-weight:700;color:var(--muted)}
.col-h .stepn{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-right:6px}
.empty{font-size:.9rem;color:var(--muted);text-align:center;padding:18px 6px;border:1px dashed var(--line);border-radius:10px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px 16px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;min-height:96px}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c,var(--norm))}
.card[data-lvl="Kritisch"]{--c:var(--sos)}.card[data-lvl="Hoch"]{--c:var(--high)}.card[data-lvl="Normal"]{--c:var(--norm)}
.card[data-done="1"]{--c:var(--ok)}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card .plate{font-size:1rem}
.card .art{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:.78rem;color:var(--muted)}
.card .txt{font-weight:600;line-height:1.3}
.card .meta{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);align-items:center}
.card .chips{display:flex;gap:6px;flex-wrap:wrap}
.ini{width:28px;height:28px;border-radius:50%;background:var(--grey-bg);display:inline-grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.8rem;color:var(--fg)}
.chip.info{background:var(--norm-bg);color:var(--norm);font-weight:600}
.chip.pend{background:var(--high-bg);color:var(--high);font-weight:700;display:inline-flex;gap:5px;align-items:center}
.chip.pend::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--high)}
.card .go{align-self:flex-start;min-height:44px;padding:8px 14px}

/* Fahrer-Meldungen im Eingang */
.mel{background:var(--surface);border:2px dashed var(--high);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mel .lbl{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;color:var(--high)}
.mel .row2{display:flex;gap:10px;align-items:flex-start}
.mel .thumb{width:58px;height:58px}
.mel .who{font-size:.84rem;color:var(--muted)}

/* Detail als großes Blatt */
.overlay{place-items:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(880px,100%);max-height:92vh;overflow-y:auto;display:flex;flex-direction:column}
.sheet.small{width:min(520px,100%)}
.sh-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.sh-head .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.sh-head .plate{font-size:1.35rem;padding:3px 10px}
.sh-head h2{font-size:1.4rem}
.sh-x{min-width:52px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:1.6rem;line-height:1}
.sh-body{padding:16px 20px 24px;display:flex;flex-direction:column;gap:18px}
.sh-body section{display:flex;flex-direction:column;gap:10px}
.sh-body h3{font-family:var(--f-display);font-size:.95rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.facts div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.facts small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;color:var(--muted);font-weight:600}
.facts b{font-weight:600}
.problem{font-size:1.1rem;font-weight:600;line-height:1.35;margin:0}
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stages button{min-height:64px;border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;font-weight:700;font-size:.95rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.stages button small{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.stages button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.stages button.past{color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:8px}
.ck{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer;user-select:none}
.ck input{width:28px;height:28px;accent-color:var(--ok);flex:none}
.ck.done{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.ck .val{margin-left:auto;display:flex;gap:6px;align-items:center}
.field{font:inherit;font-size:16px;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--fg);width:100%}
.ck .field{width:150px;font-family:var(--f-mono)}
.note-box{border-radius:10px;padding:10px 12px;background:var(--norm-bg);color:var(--fg);font-size:.92rem}
.note-box.warn{background:var(--high-bg)}
.note-box.bad{background:var(--sos-bg)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photos .grp{display:flex;flex-direction:column;gap:8px}
.photos .grp b{font-size:.9rem}
.ph-row{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:92px;height:92px;border-radius:10px;background:repeating-linear-gradient(135deg,var(--grey-bg) 0 8px,var(--surface-2) 8px 16px);display:grid;place-items:center;font-size:.72rem;color:var(--muted);text-align:center;padding:4px}
.ph.add{border:2px dashed var(--line);background:var(--surface);font-size:1.6rem;color:var(--accent);cursor:pointer}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.part .nm{display:flex;flex-direction:column;min-width:0}
.part .nm small{color:var(--muted);font-size:.8rem}
.part .q{font-family:var(--f-mono);font-weight:700}
.part .pr{font-family:var(--f-mono);color:var(--muted)}
.addpart{display:grid;grid-template-columns:minmax(0,2fr) 90px minmax(0,1fr) auto;gap:8px;align-items:end}
.addpart label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.release{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.release.ready{border-color:var(--ok)}
.req{display:flex;gap:10px;align-items:center;font-weight:600}
.req i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.9rem;flex:none;background:var(--grey-bg);color:var(--muted)}
.req.ok i{background:var(--ok);color:#fff}
.req.no{color:var(--muted)}
.done-box{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:14px;font-weight:600;display:flex;gap:12px;align-items:center}
.done-box .tick{width:40px;height:40px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:1.3rem;flex:none}
.sheet textarea.field{min-height:80px}
.sheet select.field{appearance:auto}
.foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* Stempeln (vorbereitet) */
.inactive{border:2px dashed var(--high);background:var(--high-bg);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.inactive b{font-family:var(--f-display);font-size:1.2rem}
.stamp{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stamp button{min-height:96px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-family:var(--f-display);font-weight:700;font-size:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;opacity:.5;cursor:not-allowed}
.stamp button small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted)}
.who-sees{width:100%}

@media (max-width:900px){
  .board{grid-template-columns:repeat(5,minmax(260px,82vw))}
  .overlay{align-items:end;padding:0}
  .sheet{border-radius:18px 18px 0 0;max-height:94vh}
  .stages{grid-template-columns:repeat(5,minmax(90px,1fr));overflow-x:auto}
  .photos{grid-template-columns:1fr}
  .addpart{grid-template-columns:1fr 1fr}
  .stamp{grid-template-columns:1fr 1fr}
  .demo .ctl{margin-left:0}
}
@media (max-width:640px){
  .bar .loc{order:2}
  .net{order:4}
  .timer{display:none}
  .sh-head,.sh-body,.foot{padding-inline:14px}
  .ck .field{width:110px}
  .part{grid-template-columns:minmax(0,1fr) auto}
  .part .pr{grid-column:1/-1}
}

.bar img{height:38px}
@media (max-width:1360px){.bar .area{display:none}}
@media (min-width:901px){.bar .wrap{flex-wrap:nowrap}.bar .user .who{white-space:nowrap}}
.card .chips .chip{white-space:normal;max-width:100%}
.mel .btn{white-space:normal}
/* Sprachwahl */
.langbtn{min-height:40px;border-radius:8px;border:1px solid #3a3a3a;background:#1b1b1b;color:#fff;font-weight:700;padding:6px 12px;font-family:var(--f-mono);font-size:.85rem}
.langpick{display:flex;flex-direction:column;gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.langrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.langrow button{min-height:64px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px}
.langrow button b{font-family:var(--f-mono);font-size:1.05rem}
.langrow button span{font-size:.78rem;color:var(--muted)}
.langrow button[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.langrow.big{grid-template-columns:1fr}
.langrow.big button{flex-direction:row;justify-content:flex-start;gap:14px;padding:10px 16px}
.langrow.big button span{font-size:1.05rem;color:var(--fg)}
.login .hint{text-align:left;line-height:1.7}
@media (max-width:640px){.langrow{grid-template-columns:repeat(3,1fr)}}
/* Rückmeldung an Daniel */
.fb{border:1px solid var(--line);border-left:5px solid var(--norm);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.fb.stuck{border-left-color:var(--sos)}
.fb-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.fb-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.fb-col{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fb-col.de{background:var(--norm-bg)}
.fb-col small{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.7rem;color:var(--muted);font-weight:600}
.fb-l{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.btn.mic{background:var(--norm-bg);border-color:var(--norm);color:var(--fg)}
.seg.why button{min-height:52px;flex:1 1 140px}
.mel .chips{display:flex;gap:6px;flex-wrap:wrap}
.fb-sec h3{flex-wrap:wrap}
/* Vereinfachte Startansicht */
.nav .tabbtn.quiet{font-size:1rem;min-height:48px;color:var(--muted)}
.nav .tabbtn.quiet[aria-pressed="true"]{color:var(--fg)}
.block{display:flex;flex-direction:column;gap:12px}
.blk-h{display:flex;align-items:baseline;gap:12px}
.blk-h h2{font-size:1.6rem;font-weight:700}
.blk-h .n{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;color:var(--muted)}
.big{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px 16px 24px;position:relative;overflow:hidden}
.big::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c,var(--norm))}
.big[data-lvl="Kritisch"]{--c:var(--sos);border-color:color-mix(in srgb,var(--sos) 45%,var(--line))}
.big[data-lvl="Hoch"]{--c:var(--high)}
.big[data-lvl="Normal"]{--c:var(--norm)}
.b-main{display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer}
.b-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.plate.xl{font-size:1.45rem;padding:3px 12px}
.b-kat{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
.b-txt{font-size:1.15rem;font-weight:600;line-height:1.3}
.b-act{display:flex;flex-direction:column;gap:8px}
.btn.huge{min-height:72px;font-size:1.2rem;border-radius:14px;white-space:normal}
.b-small{display:flex;gap:8px}
.b-small .btn{flex:1;min-height:52px;font-size:.95rem;white-space:normal}
.calm{background:var(--ok-bg);color:var(--ok);border-radius:14px;padding:22px;font-weight:700;font-size:1.15rem}
@media (max-width:760px){.big{grid-template-columns:minmax(0,1fr);padding-left:20px}.blk-h h2{font-size:1.35rem}}
.b-main .chip{align-self:flex-start}
#timer.warn{background:var(--sos);color:#fff;border-radius:8px;padding:2px 8px}
.ph{position:relative}
.ph-del{position:absolute;top:-8px;right:-8px;width:40px;height:40px;border-radius:50%;border:0;background:var(--sos);color:#fff;font-size:1.3rem;line-height:1;cursor:pointer;display:grid;place-items:center}
